name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Bundle
        run: npm run bundle
      - name: Unit tests
        run: npm run test:unit
      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true
